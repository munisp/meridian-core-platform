name: ci

on:
  push:
    branches: [main, hardening/*]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"
      - name: build/vet/test per module
        run: |
          set -e
          for m in \
            packages/events \
            packages/rulepack-schema \
            packages/schemas/go \
            packages/permify-models \
            packages/temporal-sdkx \
            workflows-go \
            services/rp-registry \
            services/tin-graph \
            services/ledger \
            services/notification \
            services/audit-evidence \
            services/geo \
            services/consent \
            services/search-indexer \
            services/edge-policy \
            services/admin-api; do
            echo "== $m =="
            (cd "$m" && go mod tidy && go build ./... && go vet ./... && go test -race ./...)
          done

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: |
          pip install -e packages/events/python
          pip install pytest fastapi uvicorn pydantic httpx duckdb \
            "PyJWT[crypto]" "psycopg[binary]"
      - name: pytest per service
        run: |
          set -e
          (cd packages/events/python && pytest tests/ -q)
          for s in rules-engine feature-store reg-watch settlement; do
            echo "== $s =="
            (cd "services/$s" && pytest tests/ -q)
          done

  admin-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  rust-geo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: geo-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked
