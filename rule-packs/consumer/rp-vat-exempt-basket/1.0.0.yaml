  when:
    category:
    - land_sale
    - real_estate_lease
  then:
    decision: exempt
    rate_bps: 0
    narrate: 'VAT exempt: sale/lease of land and residential accommodation'
- id: vat.exempt.financial-securities
  when:
    category:
    - money_securities
    - shares_stocks
  then:
    decision: exempt
    rate_bps: 0
    narrate: 'VAT exempt: money, securities and shares transactions'
