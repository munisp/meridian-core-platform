# rp-vat-rates v1.0.0 — Meridian rule pack (SPEC §1.4 format)
# VAT rate table (standard 7.5%) with effective dates
id: rp-vat-rates
version: 1.0.0
title: VAT rate table (standard 7.5%) with effective dates
description: 'VAT rates: standard 7.5% (from 1 Feb 2020), zero-rated and exempt classes referenced to basket packs; rate history
  retained for back-period computations.'
effective_from: '2020-02-01'
effective_to: null
status: published
subject_to_regazette: true
provenance:
  as_passed: Finance Act 2019 s.34 (VAT rate 5% -> 7.5%, effective 1 Feb 2020); Nigeria Tax Act 2025 (rate retained 7.5%)
  as_gazetted: null
  source_citation: Finance Act 2019; VAT Act Cap V1 LFN 2004 (as amended); Nigeria Tax Act 2025
rules:
- id: vat.rate.standard
  when:
    supply_class: standard
    date:
      gte: '2020-02-01'
  then:
    rate_bps: 750
    narrate: VAT standard rate 7.5%.
  effective_from: '2020-02-01'
  citation: "Finance Act 2019; VAT Act Cap V1 LFN 2004 (as amended); Nigeria Tax Act 2025"
- id: vat.rate.standard-legacy
  when:
    supply_class: standard
    date:
      lt: '2020-02-01'
  then:
    rate_bps: 500
    narrate: Legacy 5% rate for back periods before 1 Feb 2020.
  effective_from: '1994-01-01'
  effective_to: '2020-01-31'
  citation: "Finance Act 2019; VAT Act Cap V1 LFN 2004 (as amended); Nigeria Tax Act 2025"
- id: vat.rate.zero
  when:
    supply_class: zero_rated
  then:
    rate_bps: 0
    narrate: 'Zero-rated supplies: 0% with full input VAT recovery (basket in rp-vat-zerorated-basket).'
  citation: "Finance Act 2019; VAT Act Cap V1 LFN 2004 (as amended); Nigeria Tax Act 2025"
- id: vat.rate.exempt
  when:
    supply_class: exempt
  then:
    decision: no_vat_no_input_recovery
    narrate: 'Exempt supplies: no output VAT, no input VAT recovery (basket in rp-vat-exempt-basket).'
  citation: "Finance Act 2019; VAT Act Cap V1 LFN 2004 (as amended); Nigeria Tax Act 2025"
- id: vat.registration.threshold
  when:
    person: taxable
    date:
      gte: '2026-01-01'
  then:
    threshold:
      annual_taxable_supplies_kobo:
        gt: 10000000000
    narrate: NTA registration threshold N100m taxable supplies, applied gt — NTAA 2025 s.147 defines a small business as gross
      turnover of "N100,000,000 or less", so turnover of EXACTLY N100m is still exempt and registration triggers only ABOVE
      N100m. Consistent with rp-exemption-nta exempt.small-company (lte N100m exempt) and rp-turnover-bands band.exit.register.
  effective_from: '2026-01-01'
  citation: 'NTAA 2025, s.147 (Forvis Mazars: "annual turnover of N100 million or less")'
- id: vat.registration.threshold-legacy
  when:
    person: taxable
    date:
      lt: '2026-01-01'
  then:
    threshold:
      annual_taxable_supplies_kobo:
        gte: 2500000000
    narrate: Pre-2026 VAT Act registration threshold N25m taxable supplies (gte).
  effective_from: '2020-02-01'
  effective_to: '2025-12-31'
  citation: "Finance Act 2019; VAT Act Cap V1 LFN 2004 (as amended); Nigeria Tax Act 2025"
