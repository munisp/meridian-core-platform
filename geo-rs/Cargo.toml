[package]
name = "geo-rs"
version = "0.1.0"
edition = "2021"
description = "Meridian spatial engine: point-in-polygon, haversine prefilter, NG state/LGA attribution"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# otel-foundation wave: tracing + OTLP export (DESIGN-CONTRACT.md).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.31"
opentelemetry = { version = "0.30", features = ["trace"] }
opentelemetry_sdk = { version = "0.30", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.30", features = ["grpc-tonic"] }

[profile.release]
opt-level = 3
lto = true
