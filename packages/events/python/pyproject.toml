[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-events"
version = "0.1.0"
description = "Meridian core event envelope, inproc bus, outbox relay, auth and embedded store helpers (SPEC 1.1-1.3)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["meridian_events*"]
