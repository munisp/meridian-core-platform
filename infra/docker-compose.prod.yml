# docker-compose.prod.yml — national-scale production middleware register (SPEC B).
# Application services are NOT here (they run in k8s/helm per infra/helm).
# Every credential comes from .env.prod — this file carries no secrets.
# Image tags pinned; no :latest anywhere.
name: meridian-prod

services:
  # ---------------------------------------------------------------- bus
  redpanda:
    image: ${IMG_REDPANDA:-docker.redpanda.com/redpandadata/redpanda:v24.1.9}
    restart: unless-stopped
    command:
      - redpanda start
      - --mode=prod
      - --smp=2
      - --memory=4G
      - --reserve-memory=256M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
      - --pandaproxy-addr=internal://0.0.0.0:8082
      - --advertise-pandaproxy-addr=internal://redpanda:8082
      - --set redpanda.enable_idempotence=true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:9644/v1/status/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 4G}
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  # ---------------------------------------------------------------- identity
  keycloak:
    image: ${IMG_KEYCLOAK:-quay.io/keycloak/keycloak:24.0.4}
    restart: unless-stopped
    command: start --optimized --http-enabled=false --https-key-store-file=/opt/keycloak/conf/keystore.p12
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?set in .env.prod}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env.prod}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:?set in .env.prod}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
      KC_HOSTNAME: ${KC_HOSTNAME:?set in .env.prod}
      KC_HTTPS_KEY_STORE_PASSWORD: ${KC_KEYSTORE_PASSWORD:?set in .env.prod}
      KC_PROXY_HEADERS: xforwarded
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8443 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: {cpus: "1.5", memory: 1.5G}
    ports:
      - "8443:8443"
    volumes:
      - ./keycloak/keystore.p12:/opt/keycloak/conf/keystore.p12:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------- authz
  permify:
    image: ${IMG_PERMIFY:-ghcr.io/permify/permify:v0.9.9}
    restart: unless-stopped
    command: serve
    environment:
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: postgres://${POSTGRES_USER:?set in .env.prod}:${POSTGRES_PASSWORD:?set in .env.prod}@postgres:5432/permify
      PERMIFY_DATABASE_MAX_OPEN_CONNECTIONS: "20"
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}
    ports:
      - "3476:3476"
      - "3478:3478"
    volumes:
      - ../../packages/permify-models/schemas:/etc/permify/schemas:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------- gateway
  apisix:
    image: ${IMG_APISIX:-apache/apisix:3.9.1-debian}
    restart: unless-stopped
    environment:
      APISIX_STAND_ALONE: "true"
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 1G}
    ports:
      - "9080:9080"
      - "9180:9180"   # restrict to operator network at firewall
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    depends_on:
      keycloak:
        condition: service_healthy

  # ---------------------------------------------------------------- workflow
  temporal:
    image: ${IMG_TEMPORAL:-temporalio/auto-setup:1.24.2}
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${POSTGRES_USER:?set in .env.prod}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?set in .env.prod}
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/production-sql.yaml
    healthcheck:
      test: ["CMD-SHELL", "tctl cluster health | grep -q SERVING"]
      interval: 15s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2G}
    ports:
      - "7233:7233"
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_started

  temporal-ui:
    image: ${IMG_TEMPORAL_UI:-temporalio/ui:2.27.2}
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: ${TEMPORAL_UI_CORS:-http://localhost:8088}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
    ports:
      - "8088:8080"
    depends_on:
      temporal:
        condition: service_healthy

  # ---------------------------------------------------------------- data
  postgres:
    image: ${IMG_POSTGRES:-postgis/postgis:16-3.4}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
      POSTGRES_DB: meridian
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d meridian"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 4G}
    ports:
      - "5432:5432"   # restrict to app network at firewall
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../migrations/postgres/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

  redis:
    image: ${IMG_REDIS:-redis:7.2.5}
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env.prod}
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 2G}
    ports:
      - "6379:6379"   # restrict to app network at firewall
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data

  opensearch:
    image: ${IMG_OPENSEARCH:-opensearchproject/opensearch:2.14.0}
    restart: unless-stopped
    environment:
      cluster.name: meridian-search
      node.name: os-node-1
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms2g -Xmx2g
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?set in .env.prod}
      plugins.security.disabled: "false"
      plugins.security.ssl.http.enabled: "false"   # TLS terminated at APISIX
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:$${OPENSEARCH_ADMIN_PASSWORD} localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 3G}
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  tigerbeetle:
    image: ${IMG_TIGERBEETLE:-ghcr.io/tigerbeetle/tigerbeetle:0.16.4}
    restart: unless-stopped
    command:
      - start
      - --addresses=0.0.0.0:3000
      - /data/0_0.tigerbeetle
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}
    ports:
      - "3000:3000"   # restrict to app network at firewall
    volumes:
      - tigerbeetle-data:/data

  # ---------------------------------------------------------------- observability
  prometheus:
    image: ${IMG_PROMETHEUS:-prom/prometheus:v2.53.0}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 4G}
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: ${IMG_GRAFANA:-grafana/grafana:11.0.0}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env.prod}
      GF_USERS_ALLOW_SIGN_UP: "false"
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

  # R4 (S2 finding #2 / S3 #8): real trace path — OTel collector + Jaeger
  # all-in-one backend. App services point OTEL_EXPORTER_OTLP_ENDPOINT at
  # otel-collector:4317; the collector exports to jaeger:4317 (see
  # observability/otel-collector-config.yaml, otlp/jaeger exporter).
  otel-collector:
    image: ${IMG_OTELCOL:-otel/opentelemetry-collector-contrib:0.111.0}
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      - OTELCOL_PG_PASSWORD=${OTELCOL_PG_PASSWORD:?set in .env.prod}
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
      - "8888:8888"
    depends_on: [redpanda, redis, postgres, opensearch, jaeger]

  jaeger:
    image: ${IMG_JAEGER:-jaegertracing/all-in-one:1.60}
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # Jaeger UI (restrict at firewall in prod)

  alertmanager:
    image: ${IMG_ALERTMANAGER:-prom/alertmanager:v0.27.0}
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
    ports:
      - "9093:9093"   # restrict to operator network at firewall
    volumes:
      - ./observability/.alertmanager.rendered.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

volumes:
  redpanda-data:
  postgres-data:
  redis-data:
  opensearch-data:
  tigerbeetle-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:

# Boot order / prerequisites:
#   1. cp infra/.env.example infra/.env.prod and fill every ${VAR} (vault injects).
#   2. Render alertmanager config (secrets are env placeholders):
#        envsubst < infra/observability/alertmanager.yml > infra/observability/.alertmanager.rendered.yml
#   3. docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml up -d
#   4. App services run under infra/helm (k8s) against these endpoints.
