# values-dev.yaml — docker-compose / single-node dev parity profile.
# SPEC B section 6: dev = single replicas, no HPA, no KEDA, no PDB.
environment: dev

global:
  imagePullPolicy: IfNotPresent

defaults:
  replicaCount: 1
  resources:
    requests: {cpu: "250m", memory: 256Mi}
    limits: {cpu: "500m", memory: 512Mi}
  autoscaling:
    enabled: false
  pdb:
    enabled: false
  keda:
    enabled: false
  terminationGracePeriodSeconds: 15
  preStopSleepSeconds: 0

# All services fall back to `defaults`; no per-service overrides needed in dev.
services:
  filing-api: {}
  payments-api: {}
  admin-api: {}
  audit-evidence: {}
  consent: {}
  edge-policy: {}
  feature-store: {}
  geo: {}
  ledger: {}
  notification: {}
  reg-watch: {}
  rp-registry: {}
  rules-engine: {}
  search-indexer: {}
  settlement: {}
  tin-graph: {}
  kyc-worker: {}
