# values-dev.yaml — docker-compose / single-node dev parity profile.
# SPEC B section 6: dev = single replicas, no HPA, no KEDA, no PDB.
environment: dev

global:
  imagePullPolicy: IfNotPresent

defaults:
  replicaCount: 1
  resources:
    requests: {cpu: "250m", memory: 256Mi}
    limits: {cpu: "500m", memory: 512Mi}
  autoscaling:
    enabled: false
  pdb:
    enabled: false
  keda:
    enabled: false
  terminationGracePeriodSeconds: 15
  preStopSleepSeconds: 0

# All services fall back to `defaults`; no per-service overrides needed in dev.
services:
  filing-api: {}
  payments-api: {}
  admin-api: {}
  audit-evidence: {}
  consent: {}
  edge-policy: {}
  feature-store: {}
  geo: {}
  ledger: {}
  notification: {}
  reg-watch: {}
  rp-registry: {}
  rules-engine: {}
  search-indexer: {}
  settlement: {}
  tin-graph: {}
  kyc-worker: {}

# Stateful middleware workloads (fix/health-probes Deployment templates):
# required so dev render doesn't nil-pointer on .Values.workloads.
workloads:
  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.16.4
    replicas: 1
    storage: 5Gi
  temporalWorker:
    image: temporalio/auto-setup:1.24.2
    replicas: 1

# Observability stack (templates/observability.yaml): off in dev — the
# docker-compose profile carries prometheus/alertmanager/grafana locally.
observability:
  enabled: false
