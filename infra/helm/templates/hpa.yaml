# HPA per service (SPEC B section 2). cpu 65% + rps 700 + kafka_consumer_lag
# (external, consumers only). Behavior: fast scale-up, slow tax-season-safe
# scale-down (15-min stabilization, max 2 pods/min).
{{- range $name, $svc := .Values.services }}
{{- $cfg := include "meridian.serviceConfig" (dict "root" $ "svc" $svc) | fromYaml }}
{{- if $cfg.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: meridian-core
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $cfg.autoscaling.minReplicas }}
  maxReplicas: {{ $cfg.autoscaling.maxReplicas }}
  metrics:
    {{- toYaml $cfg.autoscaling.metrics | nindent 4 }}
    {{- if $svc.kafkaConsumer }}
    - type: External
      external:
        metric:
          name: kafka_consumer_lag
          selector:
            matchLabels:
              consumer-group: {{ $svc.consumerGroup | default $name }}
        target:
          type: AverageValue
          averageValue: "5000"
    {{- end }}
  behavior:
    {{- toYaml $cfg.autoscaling.behavior | nindent 4 }}
{{- end }}
{{- end }}
