# Observability stack: Prometheus + Alertmanager + Grafana (assurance D4).
# Config files are embedded from helm/files/ (copies of infra/observability/*
# — kept in sync by review; helm cannot reference paths outside the chart).
# Rendered ConfigMaps mount into the pods; Grafana gets admin creds from a
# Secret and a datasource ConfigMap provisioning Prometheus.
{{- if .Values.observability.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    {{- .Files.Get "files/prometheus.yml" | nindent 4 }}
  alerts.yml: |
    {{- .Files.Get "files/alerts.yml" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    {{- .Files.Get "files/alertmanager.yml" | nindent 4 }}
---
# Grafana datasource provisioning (Prometheus).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels: {app: prometheus}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prometheus
          image: {{ .Values.observability.prometheus.image | default "prom/prometheus:v2.53.0" }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.observability.prometheus.retention | default "30d" }}
            - --web.enable-lifecycle
          ports:
            - {containerPort: 9090, protocol: TCP}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: "500m", memory: 2Gi}
            limits: {cpu: "2", memory: 8Gi}
      volumes:
        - {name: config, configMap: {name: prometheus-config}}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector: {app: prometheus}
  ports:
    - {name: http, port: 9090, targetPort: 9090}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels: {app: alertmanager}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: alertmanager}
  template:
    metadata:
      labels: {app: alertmanager}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: alertmanager
          image: {{ .Values.observability.alertmanager.image | default "prom/alertmanager:v0.27.0" }}
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - {containerPort: 9093, protocol: TCP}
          volumeMounts:
            - {name: config, mountPath: /etc/alertmanager, readOnly: true}
            - {name: data, mountPath: /alertmanager}
          readinessProbe:
            httpGet: {path: /-/ready, port: 9093}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: "100m", memory: 128Mi}
            limits: {cpu: "500m", memory: 512Mi}
      volumes:
        - {name: config, configMap: {name: alertmanager-config}}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector: {app: alertmanager}
  ports:
    - {name: http, port: 9093, targetPort: 9093}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels: {app: grafana}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: {{ .Values.observability.grafana.image | default "grafana/grafana:11.0.0" }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: {secretKeyRef: {name: grafana-admin, key: username}}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: grafana-admin, key: password}}
          ports:
            - {containerPort: 3000, protocol: TCP}
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: data, mountPath: /var/lib/grafana}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: "100m", memory: 256Mi}
            limits: {cpu: "500m", memory: 1Gi}
      volumes:
        - {name: datasources, configMap: {name: grafana-datasources}}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector: {app: grafana}
  ports:
    - {name: http, port: 3000, targetPort: 3000}
---
# OTel collector (otel-foundation wave): config from helm/files copy of
# infra/observability/otel-collector-config.yaml. meridian-postgres Secret
# referenced for the postgresql receiver (OTELCOL_PG_PASSWORD).
apiVersion: v1
kind: ConfigMap
metadata:
  name: otelcol-config
  namespace: monitoring
data:
  config.yaml: |
    {{- .Files.Get "files/otel-collector-config.yaml" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: monitoring
  labels: {app: otel-collector}
spec:
  replicas: {{ .Values.observability.otelcol.replicas | default 1 }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: otel-collector}
  template:
    metadata:
      labels: {app: otel-collector}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: otelcol
          image: {{ .Values.observability.otelcol.image | default "otel/opentelemetry-collector-contrib:0.111.0" }}
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          env:
            - name: OTELCOL_PG_PASSWORD
              valueFrom: {secretKeyRef: {name: meridian-postgres, key: password}}
          ports:
            - {containerPort: 4317, protocol: TCP}
            - {containerPort: 4318, protocol: TCP}
            - {containerPort: 9464, protocol: TCP}
            - {containerPort: 8888, protocol: TCP}
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol-contrib, readOnly: true}
          readinessProbe:
            httpGet: {path: /metrics, port: 8888}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: "200m", memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - {name: config, configMap: {name: otelcol-config}}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  selector: {app: otel-collector}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
    - {name: otlp-http, port: 4318, targetPort: 4318}
    - {name: prom, port: 9464, targetPort: 9464}
    - {name: self-metrics, port: 8888, targetPort: 8888}
---
# R4 (S2 finding #2): real trace backend. The collector config exports
# traces via otlp/jaeger to jaeger:4317; without this Deployment every
# span was debug-logged-and-dropped.
{{- if .Values.observability.jaeger.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring
  labels: {app: jaeger}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: jaeger}
  template:
    metadata:
      labels: {app: jaeger}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: jaeger
          image: {{ .Values.observability.jaeger.image | default "jaegertracing/all-in-one:1.60" }}
          env:
            - {name: COLLECTOR_OTLP_ENABLED, value: "true"}
          ports:
            - {containerPort: 4317, protocol: TCP}
            - {containerPort: 4318, protocol: TCP}
            - {containerPort: 16686, protocol: TCP}
          readinessProbe:
            httpGet: {path: /, port: 16686}
          resources:
            requests: {cpu: "100m", memory: 256Mi}
            limits: {cpu: "500m", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: monitoring
spec:
  selector: {app: jaeger}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
    - {name: otlp-http, port: 4318, targetPort: 4318}
    - {name: ui, port: 16686, targetPort: 16686}
{{- end }}
{{- end }}
