# Secrets referenced by the chart (R4 fix, S2 findings #1/#8): previously
# grafana-admin, meridian-postgres and temporal-db were referenced but never
# defined, and audit-evidence/consent/tin-graph mandatory keys were not
# provisioned at all — pods crashlooped or failed closed.
#
# Values come from .Values.secrets.values and are OBVIOUS placeholders
# ("CHANGE_ME-..."): replace via --set/sealed values or set
# secrets.create=false and provision the same Secret names out-of-band
# (ExternalSecrets). Placeholders let pods BOOT so the chart is smoke-
# testable, but they are not production credentials.
{{- if and .Values.secrets .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: meridian-platform
  labels:
    app.kubernetes.io/part-of: meridian-core
type: Opaque
stringData:
  TAT_SEAL_KEY: {{ .Values.secrets.values.tatSealKey | quote }}
  TAT_CHAIN_HMAC_KEY: {{ .Values.secrets.values.tatChainHmacKey | quote }}
  CONSENT_RECEIPT_KEY: {{ .Values.secrets.values.consentReceiptKey | quote }}
  TIN_HMAC_KEY: {{ .Values.secrets.values.tinHmacKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: meridian-core
type: Opaque
stringData:
  username: {{ .Values.secrets.values.grafanaAdminUser | quote }}
  password: {{ .Values.secrets.values.grafanaAdminPassword | quote }}
---
# meridian-postgres is needed in BOTH namespaces: otel-collector runs in
# monitoring, the geo service runs in the default (chart) namespace, and
# secretKeyRef cannot cross namespaces.
apiVersion: v1
kind: Secret
metadata:
  name: meridian-postgres
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: meridian-core
type: Opaque
stringData:
  username: {{ .Values.secrets.values.postgresUser | quote }}
  password: {{ .Values.secrets.values.postgresPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: meridian-postgres
  labels:
    app.kubernetes.io/part-of: meridian-core
type: Opaque
stringData:
  username: {{ .Values.secrets.values.postgresUser | quote }}
  password: {{ .Values.secrets.values.postgresPassword | quote }}
---
# temporal-db is consumed by the temporal Deployment in the default
# namespace (deployment-temporal-worker.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: temporal-db
  labels:
    app.kubernetes.io/part-of: meridian-core
type: Opaque
stringData:
  username: {{ .Values.secrets.values.temporalDbUser | quote }}
  password: {{ .Values.secrets.values.temporalDbPassword | quote }}
{{- end }}
