# Dapr components (pubsub over Redpanda, statestore over Redis) — rendered
# only when .Values.dapr.enabled. STATUS: provisioned, not active
# (docs/integrations/dapr.md).
{{- if .Values.dapr.enabled }}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: meridian-pubsub
  namespace: {{ .Release.Namespace }}
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - {name: brokers, value: "redpanda:9092"}
    - {name: consumerGroup, value: "meridian-dapr"}
    - {name: authType, value: "none"}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: meridian-statestore
  namespace: {{ .Release.Namespace }}
spec:
  type: state.redis
  version: v1
  metadata:
    - {name: redisHost, value: "redis:6379"}
    - {name: actorStateStore, value: "false"}
---
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: meridian-tracing
  namespace: {{ .Release.Namespace }}
spec:
  tracing:
    samplingRate: {{ .Values.dapr.samplingRate | default "0.1" | quote }}
    otel:
      endpointAddress: otel-collector.monitoring:4317
      isSecure: false
{{- end }}
