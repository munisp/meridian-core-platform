# Meridian platform — OpenTelemetry Collector config (otel-foundation wave).
#
# Image: otel/opentelemetry-collector-contrib (contrib receivers below are
# contrib-only: kafkametrics, redis, postgresql, opensearch). Deploy:
#   mount at /etc/otelcol-contrib/config.yaml
#
# Honest status notes:
#  - temporal: there is NO contrib temporal receiver; Temporal metrics are
#    scraped by the Prometheus server (prometheus.yml job `temporal`) once the
#    server metrics listen-address is enabled. Not collected here.
#  - tigerbeetle: no contrib receiver and TigerBeetle does not expose a
#    metrics endpoint; only pipeline health is observable. Not collected.
#  - alerting: there is no upstream alertmanager exporter; alert flow is
#    collector -> prometheus exporter -> Prometheus rules (alerts.yml) ->
#    Alertmanager. The `prometheus` exporter below re-exposes everything on
#    :9464/metrics for the Prometheus server to scrape.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # REMOVED (R4, S2 finding #3 / S3 #8): the static app scrape targets
  # matched NOTHING — no application service shares the collector network
  # (compose profiles are middleware-only; k8s app pods are scraped by the
  # Prometheus server via the prometheus.io/* pod annotations the helm
  # chart stamps). Application /metrics flow: app METRICS_PORT listener
  # -> Prometheus server (prometheus.yml app jobs); OTLP-pushed app
  # telemetry still arrives via the otlp receiver below.

  # Kafka/Redpanda broker + topic + consumer-group metrics (contrib).
  kafkametrics:
    brokers: [redpanda:9092]
    protocol_version: 2.0.0
    scrapers: [brokers, topics, consumers]

  redis:
    endpoint: redis:6379
    collection_interval: 30s

  postgresql:
    endpoint: postgres:5432
    username: meridian
    password: ${env:OTELCOL_PG_PASSWORD}
    databases: [meridian]
    collection_interval: 30s
    tls:
      insecure: true

  opensearch:
    endpoint: http://opensearch:9200
    collection_interval: 30s

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

  batch:
    timeout: 5s
    send_batch_size: 1024

  # Tenant enrichment: copy the tenant.id span attribute onto the resource
  # so per-tenant series are possible downstream. R4 (S3 #7): ALLOWLIST the
  # tenant value shape — after the otelx edge hardening only verified
  # tenants arrive, this is defence in depth against cardinality bombs
  # (unbounded tenant_id label values would OOM Prometheus).
  transform/tenant:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(resource.attributes["tenant.id"], attributes["tenant.id"]) where attributes["tenant.id"] != nil and IsMatch(attributes["tenant.id"], "^[a-z0-9][a-z0-9-]{0,62}$")
    metric_statements:
      - context: datapoint
        statements:
          - set(resource.attributes["tenant.id"], attributes["tenant.id"]) where attributes["tenant.id"] != nil and IsMatch(attributes["tenant.id"], "^[a-z0-9][a-z0-9-]{0,62}$")

exporters:
  # Re-expose all metrics in Prometheus format for the existing Prometheus
  # server (single scrape of the collector replaces per-receiver wiring).
  prometheus:
    endpoint: 0.0.0.0:9464
    resource_to_telemetry_conversion:
      enabled: true   # tenant.id / service.name become metric labels

  # R4 (S2 finding #2 / S3 #8): real trace backend — Jaeger all-in-one
  # (otlp receiver on :4317). Deployed by docker-compose.prod.yml and the
  # helm chart (observability.jaeger). debug stays as a sampled snoop.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 200

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8888   # collector self-metrics; alerts.yml watches up{}
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/tenant, batch]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp, kafkametrics, redis, postgresql, opensearch]
      processors: [memory_limiter, transform/tenant, batch]
      exporters: [prometheus, debug]
    # HONEST (R4): no log backend is provisioned — logs stay on the sampled
    # debug exporter until a Loki/Elasticsearch pipeline is deployed.
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
