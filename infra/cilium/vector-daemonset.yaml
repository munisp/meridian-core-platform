# Hubble -> audit evidence (SPEC C section 4).
# vector DaemonSet scrapes /var/run/cilium/hubble/events.log on every node,
# parses JSON, drops health-check noise, produces to Kafka audit.events.v1
# (partition key = src namespace). Retention 7y in OpenSearch audit-* (SPEC B).
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-hubble-config
  namespace: monitoring
data:
  vector.yaml: |
    data_dir: /vector-data
    sources:
      hubble_flows:
        type: file
        include:
          - /var/run/cilium/hubble/events.log
        read_from: end
        host_key: node
    transforms:
      parse_flows:
        type: remap
        inputs: [hubble_flows]
        source: |
          . = parse_json(.message) ?? .keep
          . = if exists(.keep) { abort } else { . }
      drop_health_noise:
        type: filter
        inputs: [parse_flows]
        condition: |
          .flow.verdict != "FORWARDED" ||
          (.flow.l7.type != "HTTP" || !starts_with(string!(.flow.l7.http.url), "/healthz"))
      set_partition_key:
        type: remap
        inputs: [drop_health_noise]
        source: |
          .key = .flow.source.namespace // "unknown"
          .source = "hubble"
    sinks:
      audit_kafka:
        type: kafka
        inputs: [set_partition_key]
        bootstrap_servers: redpanda.kafka.svc.cluster.local:9092
        topic: audit.events.v1
        key_field: key
        encoding:
          codec: json
        compression: lz4
        acknowledgements: all
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector-hubble
  namespace: monitoring
  labels:
    app: vector
spec:
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      serviceAccountName: vector-hubble
      containers:
        - name: vector
          image: timberio/vector:0.37.0-debian
          args: ["--config", "/etc/vector/vector.yaml"]
          volumeMounts:
            - name: config
              mountPath: /etc/vector
            - name: hubble-events
              mountPath: /var/run/cilium/hubble
              readOnly: true
            - name: data
              mountPath: /vector-data
          resources:
            requests: {cpu: "200m", memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
      volumes:
        - name: config
          configMap:
            name: vector-hubble-config
        - name: hubble-events
          hostPath:
            path: /var/run/cilium/hubble
            type: Directory
        - name: data
          hostPath:
            path: /var/lib/vector-hubble
            type: DirectoryOrCreate
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector-hubble
  namespace: monitoring
