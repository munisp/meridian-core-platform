# enclave namespace (SPEC C section 3): sovereign zone lockdown.
# Deny internet egress entirely; ingress only from the meridian-core
# enclave-gateway serviceaccount. DNS restricted to enclave-local names.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: enclave-lockdown
  namespace: enclave
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: meridian-core
            app: enclave-gateway
      toPorts:
        - ports:
            - {port: "8443", protocol: TCP}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: ANY}
          rules:
            dns:
              - matchPattern: "*.enclave.svc.cluster.local"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: data
            app: minio-enclave
      toPorts:
        - ports:
            - {port: "9000", protocol: TCP}
  egressDeny:
    - toCIDR:
        - 0.0.0.0/0
---
# Allow prometheus scraping from monitoring (audit requires flow visibility).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: enclave-allow-monitoring
  namespace: enclave
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app: prometheus
      toPorts:
        - ports:
            - {port: "9090", protocol: TCP}
