# kafka namespace (SPEC C section 3): Redpanda brokers.
# Default-deny; ingress from meridian-core producers/consumers on 9092,
# intra-broker replication, and vector (audit flow export) producing to
# audit.events.v1.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: kafka
spec:
  # Real default-deny (A8): endpointSelector {} with NO ingress/egress allow
  # entries puts every pod in this namespace into default-deny for BOTH
  # directions. The previous `- {}` entries were allow-all in Cilium.
  # Only the companion allow-* policies below open specific flows
  # (kube-dns UDP/53, middleware peers, APISIX ingress) — mirrors the
  # correct enclave lockdown pattern in enclave.yaml.
  endpointSelector: {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-kafka-dns
  namespace: kafka
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: ANY}
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-kafka-ingress
  namespace: kafka
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: meridian-core
      toPorts:
        - ports:
            - {port: "9092", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kafka
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app: vector
      toPorts:
        - ports:
            - {port: "9092", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app: prometheus
