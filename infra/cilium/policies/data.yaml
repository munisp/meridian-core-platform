# data namespace (SPEC C section 3): postgres / minio / opensearch /
# tigerbeetle. Default-deny; ingress only from meridian-core (+ enclave for
# minio-enclave), intra-data replication traffic, and monitoring.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: data
spec:
  # Real default-deny (A8): endpointSelector {} with NO ingress/egress allow
  # entries puts every pod in this namespace into default-deny for BOTH
  # directions. The previous `- {}` entries were allow-all in Cilium.
  # Only the companion allow-* policies below open specific flows
  # (kube-dns UDP/53, middleware peers, APISIX ingress) — mirrors the
  # correct enclave lockdown pattern in enclave.yaml.
  endpointSelector: {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-data-dns
  namespace: data
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: ANY}
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-data-ingress
  namespace: data
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: meridian-core
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: data
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: enclave
      toPorts:
        - ports:
            - {port: "9000", protocol: TCP}   # enclave -> minio-enclave only
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app: prometheus
