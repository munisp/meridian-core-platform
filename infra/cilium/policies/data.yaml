# data namespace (SPEC C section 3): postgres / minio / opensearch /
# tigerbeetle. Default-deny; ingress only from meridian-core (+ enclave for
# minio-enclave), intra-data replication traffic, and monitoring.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: data
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-data-dns
  namespace: data
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: ANY}
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-data-ingress
  namespace: data
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: meridian-core
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: data
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: enclave
      toPorts:
        - ports:
            - {port: "9000", protocol: TCP}   # enclave -> minio-enclave only
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app: prometheus
