# platform-auth namespace (SPEC C section 3): Keycloak.
# Default-deny; ingress from meridian-core on 8443 (token/JWKS), from
# inclusion via APISIX for login flows; egress to data (its database) + DNS.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: platform-auth
spec:
  # Real default-deny (A8): endpointSelector {} with NO ingress/egress allow
  # entries puts every pod in this namespace into default-deny for BOTH
  # directions. The previous `- {}` entries were allow-all in Cilium.
  # Only the companion allow-* policies below open specific flows
  # (kube-dns UDP/53, middleware peers, APISIX ingress) — mirrors the
  # correct enclave lockdown pattern in enclave.yaml.
  endpointSelector: {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-platform-auth
  namespace: platform-auth
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: meridian-core
      toPorts:
        - ports:
            - {port: "8443", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app: prometheus
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: ANY}
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: data
            app: postgres
      toPorts:
        - ports:
            - {port: "5432", protocol: TCP}
