# Cilium helm values (SPEC C section 2), prod cluster.
# Requires kernel >= 5.10 (bpftool-capable nodes).
kubeProxyReplacement: "true"
k8sServiceHost: api-lb.meridian.internal   # replace with actual API LB
k8sServicePort: 6443

operator:
  replicas: 2

ipam:
  mode: kubernetes

# WireGuard node-to-node encryption. Defense in depth: existing mTLS stays
# for service identity/authz at the app layer (SPEC C section 1).
encryption:
  enabled: true
  type: wireguard
  nodeEncryption: true

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
    ingress:
      enabled: true
      hosts: [hubble.nrs.internal]
      tls:
        - secretName: hubble-tls
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - httpV2
    serviceMonitor:
      enabled: true
  export:
    # Flow logs -> Kafka audit.events.v1 via vector DaemonSet
    # (infra/cilium/vector-daemonset.yaml).
    dynamic:
      filePath: /var/run/cilium/hubble/events.log

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true

tetragon:
  enabled: true

# ROLLOUT: start with "never", observe 1 week, apply CNPs in audit mode,
# then flip to "always" per namespace (see infra/cilium/ROLLOUT.md).
policyEnforcementMode: "never"

loadBalancer:
  mode: hybrid

bandwidthManager:
  enabled: true
  bbr: true
