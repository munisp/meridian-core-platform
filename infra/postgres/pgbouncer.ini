;; PgBouncer sidecar config (SPEC B section 3).
;; Transaction pooling; deployed 3 replicas behind a headless Service.
;;
;; Pool math (per SPEC B):
;;   Postgres writes 25k w/s peak; reads via replicas 10:1.
;;   PG max_connections = 600 (1 primary + 3 read replicas, streaming;
;;   synchronous_commit=remote_apply for ledger-adjacent only).
;;   default_pool_size = 200 per sidecar keeps server conns well under 600
;;   (3 sidecars x 200 = 600 ceiling, only reached if all pools saturate —
;;   in practice per-database pools share the budget; monitor
;;   pgbouncer_pools_server_active_connections).
;;   max_client_conn = 10000 per sidecar absorbs USSD/API fan-in.

[databases]
meridian = host=postgres-primary.data.svc.cluster.local port=5432 dbname=meridian
meridian_ro = host=postgres-replicas.data.svc.cluster.local port=5432 dbname=meridian

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
default_pool_size = 200
max_client_conn = 10000
reserve_pool_size = 25
reserve_pool_timeout = 3

server_idle_timeout = 60
server_lifetime = 1800
server_connect_timeout = 5
query_wait_timeout = 10
client_idle_timeout = 60

ignore_startup_parameters = extra_float_digits
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats

log_connections = 0
log_disconnections = 0
