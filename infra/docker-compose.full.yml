# Meridian core platform — full local stack (SPEC 2 infra).
# Services themselves run dev-standalone; this compose brings up the rails.
name: meridian-core
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.7
    command: ["redpanda", "start", "--mode=dev-container", "--smp=1", "--memory=1G",
              "--kafka-addr=PLAINTEXT://0.0.0.0:9092", "--advertise-kafka-addr=PLAINTEXT://localhost:9092",
              "--pandaproxy-addr=0.0.0.0:8082", "--advertise-pandaproxy-addr=localhost:8082"]
    ports: ["9092:9092", "8082:8082", "9644:9644"]
  temporal:
    image: temporalio/auto-setup:1.24.2
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=meridian
      - POSTGRES_PWD=meridian
      - POSTGRES_SEEDS=postgres
    ports: ["7233:7233"]
    depends_on: [postgres]
  temporal-ui:
    image: temporalio/ui:2.28.0
    environment: [TEMPORAL_ADDRESS=temporal:7233]
    ports: ["8080:8080"]
    depends_on: [temporal]
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      - POSTGRES_USER=meridian
      - POSTGRES_PASSWORD=meridian
      - POSTGRES_DB=meridian
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ["9200:9200"]
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    command: server /data --console-address ":9001"
    environment: [MINIO_ROOT_USER=meridian, MINIO_ROOT_PASSWORD=meridian123]
    ports: ["9000:9000", "9001:9001"]
  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.16.4
    command: ["start", "--addresses=0.0.0.0:3000", "--development", "/data/cluster.tigerbeetle"]
    ports: ["3000:3000"]
    volumes: [tbdata:/data]
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev
    environment: [KEYCLOAK_ADMIN=admin, KEYCLOAK_ADMIN_PASSWORD=admin]
    ports: ["8085:8080"]
  permify:
    image: ghcr.io/permify/permify:v1.0.0
    command: serve
    ports: ["3476:3476", "3478:3478"]
  apisix:
    image: apache/apisix:3.9.0-debian
    environment: [APISIX_STAND_ALONE=true]
    ports: ["9080:9080", "9180:9180"]
    depends_on: [etcd]
  etcd:
    image: bitnami/etcd:3.5
    environment: [ALLOW_NONE_AUTHENTICATION=yes]
    ports: ["2379:2379"]

  # ---- otel-foundation wave: collector + alertmanager -------------------
  # Receives OTLP (4317 grpc / 4318 http), re-exports Prometheus on :9464.
  # Config: observability/otel-collector-config.yaml. Set OTELCOL_PG_PASSWORD.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      - OTELCOL_PG_PASSWORD=${OTELCOL_PG_PASSWORD:-meridian}
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports: ["4317:4317", "4318:4318", "9464:9464", "8888:8888"]
    depends_on: [redpanda, redis, postgres, opensearch]

  # Config contains ${ENV} placeholders: render with envsubst into
  # observability/.alertmanager.rendered.yml before starting (see file header).
  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./observability/.alertmanager.rendered.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["9093:9093"]

volumes:
  pgdata: {}
  tbdata: {}
