# Full local stack: every external dependency for the core platform.
# Everything else (inproc bus, embedded stores, dev auth, inproc temporal
# runner, local WORM dir, local index) keeps working when this file is NOT
# running; this compose upgrades dev to the real rails.
#
# Usage:  docker compose -f infra/docker-compose.full.yml up -d
# Env:    source infra/.env.example (dev defaults match these services)
name: meridian-full

services:
  # ---------------------------------------------------------------- bus
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.4
    command:
      - redpanda start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
    ports: ["19092:19092", "18082:18082", "9644:9644"]

  # ---------------------------------------------------------------- identity
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports: ["8085:8080"]

  permify:
    image: ghcr.io/permify/permify:v0.9.7
    command: serve
    environment:
      PERMIFY_DATABASE_ENGINE: memory
    ports: ["3476:3476", "3478:3478"]
    volumes:
      - ../../packages/permify-models/schemas:/etc/permify/schemas:ro

  # ---------------------------------------------------------------- gateway
  apisix:
    image: apache/apisix:3.9.1-debian
    environment:
      APISIX_STAND_ALONE: "true"
    ports: ["9080:9080", "9180:9180"]
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    depends_on: [keycloak]

  # ---------------------------------------------------------------- workflow
  temporal:
    image: temporalio/auto-setup:1.24.2
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: meridian
      POSTGRES_PWD: meridian
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports: ["7233:7233"]
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    depends_on: [postgres]

  temporal-ui:
    image: temporalio/ui:2.27.1
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["8088:8080"]
    depends_on: [temporal]

  # ---------------------------------------------------------------- data
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migrations/postgres/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

  redis:
    image: redis:7.2
    ports: ["6379:6379"]

  opensearch:
    image: opensearchproject/opensearch:2.14.0
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: Meridian-admin-1
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ports: ["9200:9200"]

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.16.4
    command:
      - start
      - --addresses=0.0.0.0:3000
      - --development
      - /data/0_0.tigerbeetle
    ports: ["3000:3000"]
    volumes:
      - tbdata:/data

  # ---------------------------------------------------------------- observability
  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:11.0.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports: ["3000:3000"]
    depends_on: [prometheus]

  # R4 (S2 finding #2): real trace backend — Jaeger all-in-one. The
  # collector exports spans via otlp/jaeger (see otel-collector-config.yaml).
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports: ["16686:16686", "14317:4317", "14318:4318"]

  # Config contains ${ENV} placeholders: render with envsubst into
  # observability/.alertmanager.rendered.yml before starting (see file header).
  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports: ["9093:9093"]
    volumes:
      - ./observability/.alertmanager.rendered.yml:/etc/alertmanager/alertmanager.yml:ro

  # OTel collector (otel-foundation wave): single OTLP intake + middleware
  # receivers (kafkametrics/redis/postgresql/opensearch) re-exported to
  # Prometheus. Config: infra/observability/otel-collector-config.yaml.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      - OTELCOL_PG_PASSWORD=meridian
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC — point OTEL_EXPORTER_OTLP_ENDPOINT here
      - "4318:4318"   # OTLP HTTP
      - "9464:9464"   # Prometheus re-export (scraped by prometheus.yml)
      - "8888:8888"   # collector self-metrics
    depends_on: [redpanda, redis, postgres, opensearch, jaeger]

volumes:
  pgdata:
  tbdata:
