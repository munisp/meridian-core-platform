# Dapr state store over the existing Redis (idempotency/lock state).
# STATUS: provisioned, NOT active (docs/integrations/dapr.md).
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: meridian-statestore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis:6379
    - name: redisPassword
      value: ""
    - name: actorStateStore
      value: "false"
