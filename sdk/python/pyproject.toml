[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-sdk"
version = "0.1.0"
description = "Hand-written typed SDK for the Meridian platform (onboarding, tin-graph, ledger first)"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pydantic>=2.6"]

[tool.setuptools.packages.find]
include = ["meridian_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
